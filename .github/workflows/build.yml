name: Build C++ Win32 App

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出源代码 (Checkout code)
      uses: actions/checkout@v4

    # 保留此步骤：虽然不用 cl.exe，但需要它来加载 Windows SDK 的路径 (kernel32.lib 等)
    - name: 配置 Windows SDK 环境 (Setup SDK)
      uses: ilammy/msvc-dev-cmd@v1

    - name: 使用 Clang 编译代码 (Compile with Clang)
      shell: cmd
      run: |
        clang++ -O3 -mwindows CryptoFloatMonitor.cpp -o CryptoFloatMonitor.exe -Wl,/ENTRY:WinMainCRTStartup -Wl,/NODEFAULTLIB -lkernel32 -luser32 -lgdi32 -lshell32 -ladvapi32 -lwinhttp -lmsvcrt

    - name: 上传生成的 EXE 文件 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: CryptoFloatMonitor-EXE
        path: CryptoFloatMonitor.exe
