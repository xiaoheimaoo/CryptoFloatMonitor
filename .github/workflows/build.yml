name: Build C++ Win32 App

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出源代码 (Checkout code)
      uses: actions/checkout@v4

    - name: 载入系统自带的 MinGW (GCC) 环境
      shell: pwsh
      run: echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

    - name: 使用 GCC 编译无 CRT 原生代码
      shell: cmd
      run: |
        g++ -O3 -mwindows CryptoFloatMonitor.cpp -o CryptoFloatMonitor.exe -Wl,-eWinMainCRTStartup -nostartfiles -lkernel32 -luser32 -lgdi32 -lshell32 -ladvapi32 -lwinhttp -lmsvcrt

    - name: 上传生成的 EXE 文件 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: CryptoFloatMonitor-EXE
        path: CryptoFloatMonitor.exe
